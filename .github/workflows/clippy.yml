name: Code check

on:
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: target
          key: fmt-build-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            fmt-build-${{ hashFiles('**/Cargo.lock') }}
      - name: fmt check
        run: cargo fmt --all -- --check
