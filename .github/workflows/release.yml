name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Gate: never publish or attach artifacts for a tag whose tests don't pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest
      - name: test
        run: cargo test --locked --verbose

  release-crates:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: publish to crates.io
        # Skip if this version is already published so re-running a release is
        # idempotent, but let any real publish failure fail the job.
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsSL -A "aws-mfa-session-release-ci" \
            "https://crates.io/api/v1/crates/aws-mfa-session/${version}" -o /dev/null; then
            echo "aws-mfa-session ${version} is already on crates.io; skipping publish."
          else
            cargo publish --locked --token "${CARGO_TOKEN}"
          fi

  release-cross-compile:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any Linux, including Alpine and
          # scratch images.
          - target: x86_64-unknown-linux-musl
            zig-target: x86_64-unknown-linux-musl
            asset: aws-mfa-session-x86_64-linux
          - target: aarch64-unknown-linux-musl
            zig-target: aarch64-unknown-linux-musl
            asset: aws-mfa-session-aarch64-linux
          # glibc binaries run on any distribution with glibc 2.17 or newer
          # (RHEL/CentOS 7, Ubuntu 14.04, Debian 8 onwards).
          - target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
            asset: aws-mfa-session-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
            asset: aws-mfa-session-aarch64-linux-gnu
          # FreeBSD 14 or newer.
          - target: x86_64-unknown-freebsd
            zig-target: x86_64-unknown-freebsd
            asset: aws-mfa-session-x86_64-freebsd
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild
      - name: build release
        run: cargo zigbuild --release --locked --target ${{ matrix.zig-target }}
      - name: smoke test
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: target/${{ matrix.target }}/release/aws-mfa-session --version
      - name: archive
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }}.tar.gz aws-mfa-session
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-osx:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            asset: aws-mfa-session-aarch64-osx
          # Cross-compiled on Apple Silicon: the Intel runners are several
          # times slower. Smoke-tested under Rosetta 2.
          - target: x86_64-apple-darwin
            arch: x86_64
            asset: aws-mfa-session-x86_64-osx
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: install Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: check architecture
        run: test "$(lipo -archs target/${{ matrix.target }}/release/aws-mfa-session)" = "${{ matrix.arch }}"
      - name: smoke test
        run: target/${{ matrix.target }}/release/aws-mfa-session --version
      - name: archive
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }}.tar.gz aws-mfa-session
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: aws-mfa-session-x86_64-windows
          # Windows on Arm, built natively on an Arm runner.
          - os: windows-11-arm
            asset: aws-mfa-session-aarch64-windows
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
      - name: build release
        run: cargo build --release --locked --verbose
      - name: smoke test
        run: target/release/aws-mfa-session.exe --version
      - name: archive
        run: tar -C target/release -czf ${{ matrix.asset }}.tar.gz aws-mfa-session.exe
        shell: bash
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
