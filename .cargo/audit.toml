# cargo-audit configuration — https://docs.rs/cargo-audit
#
# No advisories are ignored. Add an entry here only when an advisory has no
# available fix on our dependency path, with a comment saying where it comes
# from, and remove it once the fix lands.
#
# The legacy hyper 0.14 / rustls 0.21 HTTP client (and its rustls-webpki 0.101
# advisories) is kept out of the tree by disabling the `rustls` feature of the
# aws-sdk-* crates in Cargo.toml.
[advisories]
ignore = []
